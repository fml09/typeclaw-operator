name: Secret Leak Detection

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  betterleaks:
    name: Betterleaks Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: 1.7.2
          BETTERLEAKS_SHA256: ea9ed6a4aa2845ac2e00c0eafbc841057631321d53c061d5a435cf33e6e9ddaf
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$BETTERLEAKS_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/betterleaks"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          test -x "$install_dir/betterleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Betterleaks Scan
        run: |
          betterleaks git . --redact --exit-code 1
