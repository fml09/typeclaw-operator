replicaCount: 1

image:
  repository: ghcr.io/fml09/typeclaw-operator
  # Empty tag falls back to the chart appVersion (prefixed with v).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

metricsBindAddress: ":8080"
healthProbeBindAddress: ":8081"

metricsService:
  enabled: false
  port: 8080
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
