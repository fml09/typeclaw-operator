replicaCount: 1

image:
  repository: ghcr.io/fml09/typeclaw-operator
  # Empty tag falls back to the chart appVersion (prefixed with v).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

metricsBindAddress: ":8080"
healthProbeBindAddress: ":8081"

metricsService:
  enabled: false
  port: 8080
  type: ClusterIP

credentialBroker:
  # The broker is disabled unless an administrator provisions the TLS Secret.
  enabled: false
  bindAddress: ":8443"
  port: 8443
  trustDomain: typeclaw.local
  tls:
    secretName: ""
    certificateKey: tls.crt
    privateKey: tls.key
    clientCAKey: ca.crt

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
