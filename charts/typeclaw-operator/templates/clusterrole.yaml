{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "typeclaw-operator.fullname" . }}-manager-role
  labels:
    {{- include "typeclaw-operator.labels" . | nindent 4 }}
# Kept in step with config/rbac/role.yaml by hand: controller-gen writes only
# the config/ copy, and nothing syncs the two. TestChartClusterRoleMatchesGeneratedRole
# fails when they diverge.
rules:
  - apiGroups:
    - ""
    resources:
    - configmaps
    - persistentvolumeclaims
    - secrets
    - serviceaccounts
    - services
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - ""
    resources:
    - endpoints
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ""
    resources:
    - events
    verbs:
    - create
    - patch
  - apiGroups:
    - ""
    resources:
    - pods
    verbs:
    - delete
    - get
    - list
    - watch
  - apiGroups:
    - apps
    resources:
    - deployments
    - statefulsets
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - batch
    resources:
    - cronjobs
    - jobs
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - cdi.kubevirt.io
    resources:
    - datavolumes
    verbs:
    - create
    - delete
    - get
    - list
    - watch
  - apiGroups:
    - kubevirt.io
    resources:
    - virtualmachineinstances
    - virtualmachines
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - networking.k8s.io
    resources:
    - ingresses
    - networkpolicies
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - rolebindings
    - roles
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  # The Desktop Gateway's Role names these KubeVirt subresources, and the API
  # server refuses to let the manager grant what it does not hold itself.
  - apiGroups:
    - subresources.kubevirt.io
    resources:
    - virtualmachineinstances/vnc
    - virtualmachineinstances/vnc/screenshot
    verbs:
    - get
  - apiGroups:
    - subresources.kubevirt.io
    resources:
    - virtualmachines/start
    - virtualmachines/stop
    verbs:
    - update
  - apiGroups:
    - typeclaw.fml09.io
    resources:
    - credentialapprovals
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - typeclaw.fml09.io
    resources:
    - credentialrequests
    verbs:
    - create
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - typeclaw.fml09.io
    resources:
    - credentialrequests/status
    - typeclawinstances/status
    verbs:
    - get
    - patch
    - update
  - apiGroups:
    - typeclaw.fml09.io
    resources:
    - typeclawinstances
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - typeclaw.fml09.io
    resources:
    - typeclawinstances/finalizers
    verbs:
    - update
{{- end }}
