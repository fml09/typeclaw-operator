apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "typeclaw-operator.fullname" . }}
  labels:
    {{- include "typeclaw-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "typeclaw-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "typeclaw-operator.selectorLabels" . | nindent 8 }}
        {{- if .Values.credentialBroker.enabled }}
        typeclaw.fml09.io/component: credential-broker
        {{- end }}
    spec:
      serviceAccountName: {{ include "typeclaw-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.credentialBroker.enabled }}
      volumes:
        - name: credential-broker-tls
          secret:
            secretName: {{ required "credentialBroker.tls.secretName is required when credentialBroker.enabled" .Values.credentialBroker.tls.secretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentialBroker.tls.certificateKey }}
                path: tls.crt
              - key: {{ .Values.credentialBroker.tls.privateKey }}
                path: tls.key
              - key: {{ .Values.credentialBroker.tls.clientCAKey }}
                path: ca.crt
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address={{ .Values.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            {{- if .Values.credentialBroker.enabled }}
            - --credential-broker-bind-address={{ .Values.credentialBroker.bindAddress }}
            - --credential-broker-certificate=/var/run/typeclaw/credential-broker/tls.crt
            - --credential-broker-private-key=/var/run/typeclaw/credential-broker/tls.key
            - --credential-broker-client-ca=/var/run/typeclaw/credential-broker/ca.crt
            - --credential-broker-trust-domain={{ .Values.credentialBroker.trustDomain }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.credentialBroker.enabled }}
            - name: credential-broker
              containerPort: {{ .Values.credentialBroker.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.credentialBroker.enabled }}
          volumeMounts:
            - name: credential-broker-tls
              mountPath: /var/run/typeclaw/credential-broker
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
