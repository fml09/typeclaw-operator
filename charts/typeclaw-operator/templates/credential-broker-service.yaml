{{- if .Values.credentialBroker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "typeclaw-operator.fullname" . }}-credential-broker
  labels:
    {{- include "typeclaw-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "typeclaw-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: credential-broker
      port: {{ .Values.credentialBroker.port }}
      targetPort: credential-broker
      protocol: TCP
{{- end }}
