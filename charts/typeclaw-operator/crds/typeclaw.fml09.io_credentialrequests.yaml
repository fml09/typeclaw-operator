---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: credentialrequests.typeclaw.fml09.io
spec:
  group: typeclaw.fml09.io
  names:
    categories:
    - typeclaw
    kind: CredentialRequest
    listKind: CredentialRequestList
    plural: credentialrequests
    singular: credentialrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runnerName
      name: Runner
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CredentialRequestSpec is the broker-produced, immutable intent record. The
              broker stores only a digest of the one-shot ticket; the ticket itself is
              returned once to the caller and never persisted in Kubernetes.
            properties:
              body:
                maxLength: 65536
                type: string
              consumer:
                description: Consumer selects an administrator-declared Credential
                  Consumer.
                minLength: 1
                type: string
              expiresAt:
                description: ExpiresAt bounds the one-shot ticket lifetime.
                format: date-time
                type: string
              instance:
                description: Instance names the TypeClaw Instance whose policy authorizes
                  this use.
                minLength: 1
                type: string
              operation:
                description: Operation is restricted to the typed operation set.
                enum:
                - github.createIssue
                type: string
              repository:
                description: |-
                  Repository, Title, and Body are the typed github.createIssue payload.
                  They intentionally remain flat in the wire schema.
                minLength: 3
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$
                type: string
              secretBinding:
                description: |-
                  SecretBinding snapshots the exact administrator-approved Secret
                  metadata into the immutable request. Rotation therefore invalidates
                  pending and reusable tickets instead of silently switching credentials.
                properties:
                  immutable:
                    description: |-
                      Immutable must be true. Mutable name-only Secret projection is not a
                      supported credential binding.
                    type: boolean
                  key:
                    description: Key is the only key projected into a Credential Runner.
                    minLength: 1
                    pattern: ^[A-Za-z0-9._-]+$
                    type: string
                  name:
                    description: Name is the immutable Secret name in the TypeClaw
                      Instance namespace.
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  resourceVersion:
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID and ResourceVersion bind the request to the exact Secret identity
                      observed by the controller before the Runner is created.
                    minLength: 1
                    type: string
                required:
                - immutable
                - key
                - name
                - resourceVersion
                - uid
                type: object
              ticketDigest:
                description: TicketDigest is SHA-256(ticket), never the ticket itself.
                pattern: ^[a-f0-9]{64}$
                type: string
              title:
                maxLength: 256
                minLength: 1
                type: string
            required:
            - body
            - consumer
            - expiresAt
            - instance
            - operation
            - repository
            - secretBinding
            - ticketDigest
            - title
            type: object
            x-kubernetes-validations:
            - message: credential request intent is immutable
              rule: self == oldSelf
          status:
            description: |-
              CredentialRequestStatus contains only state, identities, and sanitized
              result/error data. It never contains a ticket or credential bytes.
            properties:
              errorCode:
                description: ErrorCode is a bounded code, not raw Runner output.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: CredentialPhase describes the one-shot invocation state
                  machine.
                enum:
                - Pending
                - PendingApproval
                - TicketConsumed
                - Running
                - Succeeded
                - Failed
                - Denied
                - UnknownOutcome
                type: string
              podUID:
                type: string
              result:
                description: GitHubIssueResult is the bounded, non-secret result returned
                  by the Runner.
                properties:
                  number:
                    format: int64
                    type: integer
                  title:
                    type: string
                  url:
                    type: string
                required:
                - number
                - title
                - url
                type: object
              runnerName:
                type: string
              secretResourceVersion:
                type: string
              secretUID:
                type: string
              specDigest:
                type: string
              ticketConsumedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
